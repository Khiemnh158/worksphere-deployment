name: worksphere-deployment

services:
  prometheus:
    image: worksphere-prometheus:3.5.0
    build: prometheus
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - prometheus-data:/prometheus
    networks: [app]

  grafana:
    image: worksphere-grafana:12.1.1
    build: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Load .env.ci}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [app]

networks:
  app:

volumes:
  prometheus-data:
  grafana-data:
